name: Build and test SABEEL
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sabeel
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: sabeel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sabeel -d sabeel_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr antiword fonts-dejavu-core
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
        env:
          INTEGRATION_DATABASE_URL: postgresql://sabeel:integration-test-only@localhost:5432/sabeel_test
      - run: createdb -h localhost -U sabeel sabeel_serverless_test
        env:
          PGPASSWORD: integration-test-only
      - run: npm run test:serverless
        env:
          SERVERLESS_TEST_DATABASE_URL: postgresql://sabeel:integration-test-only@localhost:5432/sabeel_serverless_test
      - run: docker build -t sabeel-ci .
